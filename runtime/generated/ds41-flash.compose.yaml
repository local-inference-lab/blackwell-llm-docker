# Generated by python -m runtime.generate compose; requires a profile-enabled image.
name: ds41-flash
services:
  model:
    image: ${LIL_IMAGE:?Set a profile-enabled image}
    init: true
    network_mode: host
    ipc: host
    restart: 'no'
    entrypoint:
    - /usr/local/bin/lil-serve
    command:
    - --profile
    - ds41-flash
    - --hardware
    - rtx-pro-6000-pcie
    environment:
      MODEL: ${MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      TP: '4'
      DCP: ${DCP:-1}
      SPECULATOR: ${SPECULATOR:-dspark}
    volumes:
    - model-cache:/root/.cache/huggingface
    - runtime-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - ${GPU0:-0}
            - ${GPU1:-1}
            - ${GPU2:-2}
            - ${GPU3:-3}
            capabilities:
            - gpu
volumes:
  model-cache: {}
  runtime-cache: {}
